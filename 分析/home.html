<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二階</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap");

      * {
        user-select: none;
      }
      body {
        font-family: "Noto Sans TC", sans-serif;
        background-color: #f8fafc;
      }

      input:focus {
        outline: none;
      }
      .custom-table {
        border-collapse: collapse;
        width: 100%;
        min-width: 1800px;
        background-color: white;
        border: 2px solid #94a3b8; /* 外圓框較亮灰 */
        border-radius: 8px; /* 加點圓角 */
        overflow: hidden;
      }

      .custom-table th,
      .custom-table td {
        border: 1px solid #e2e8f0; /* 內部格線更淡化 */
        padding: 0.6rem 0.5rem;
        vertical-align: middle;
        text-align: center;
      }

      .custom-table thead th {
        background-color: #f1f5f9;
        color: #334155;
        font-weight: 700;
        text-align: center;
        border-bottom: 2px solid #cbd5e1; /* 標題下方分割線 */
      }

      .item-block {
        border-bottom: 3px solid #cbd5e1; /* 校系之間的粗隔線，改用亮灰色 */
      }

      .border-thick-r {
        border-right: 2px solid #cbd5e1 !important; /* 垂直分隔群組的粗灰線 */
      }

      .col-id {
        width: 4%;
        text-align: center;
        font-weight: 700;
        font-size: 1.1rem;
        color: #475569;
        border-left: 4px solid transparent;
      }
      .col-dept {
        width: 8%;
        text-align: center;
        font-weight: 500;
      }
      .col-prediction {
        width: 6%;
        text-align: center;
      }
      .col-subject-label {
        width: 6%;
        font-size: 0.85rem;
        white-space: nowrap;
        text-align: center;
        color: #475569;
        font-weight: 500;
      }
      .col-score {
        width: 3%;
        text-align: center;
      }
      .col-combo {
        width: 9%;
        text-align: center;
      }
      .col-quota {
        width: 4%;
        text-align: center;
      }
      .col-date {
        width: 4%;
        text-align: center;
      }
      .col-phase2 {
        width: 9%;
      }
      .col-note {
        width: 12%;
      }
      .col-career {
        width: 16%;
      }

      /* 隱藏捲動條但保留滾動功能 */
      .hide-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
      }
    </style>
  </head>
  <body class="p-3 md:p-6 text-slate-800">
    <div class="max-w-[1500px] mx-auto space-y-6">
      <div
        class="bg-white shadow-lg rounded-xl p-5 md:p-6 border border-slate-200"
      >
        <div
          class="flex flex-col md:flex-row justify-between items-center md:items-start gap-6 w-full"
        >
          <div
            class="flex-1 w-full flex flex-col items-center md:items-start text-center md:text-left"
          >
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">
              二階校系選擇一覽表
            </h1>
            <div class="w-full mt-4 flex justify-center md:justify-start">
              <div class="relative w-full max-w-[500px]">
                <span
                  class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none"
                >
                  <svg
                    class="h-5 w-5 text-indigo-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                    ></path>
                  </svg>
                </span>
                <input
                  type="text"
                  id="search-input"
                  placeholder="請輸入想要搜尋的校系或學校名稱..."
                  oninput="applySearchFilter()"
                  class="block w-full pl-11 pr-4 py-2.5 bg-slate-50 border-2 border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 text-base shadow-sm transition-all text-slate-700 placeholder:text-slate-400 font-medium"
                />
              </div>
            </div>
          </div>
        </div>

        <div
          class="mt-6 p-5 bg-indigo-50/50 rounded-xl border border-indigo-100"
        >
          <h2
            class="text-sm font-bold text-indigo-900 mb-4 flex items-center gap-2"
          >
            學測成績：
          </h2>
          <div class="flex flex-wrap gap-3 items-center">
            <div
              class="flex items-center bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden"
            >
              <span
                class="bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 border-r border-slate-200"
                >國文</span
              >
              <div
                id="score-chinese"
                class="w-16 p-2 text-center text-indigo-700 font-bold"
              ></div>
            </div>
            <div
              class="flex items-center bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden"
            >
              <span
                class="bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 border-r border-slate-200"
                >英文</span
              >
              <div
                id="score-english"
                class="w-16 p-2 text-center text-indigo-700 font-bold"
              ></div>
            </div>
            <div
              class="flex items-center bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden"
            >
              <span
                class="bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 border-r border-slate-200"
                >數A</span
              >
              <div
                id="score-mathA"
                class="w-16 p-2 text-center text-indigo-700 font-bold"
              ></div>
            </div>
            <div
              class="flex items-center bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden"
            >
              <span
                class="bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 border-r border-slate-200"
                >數B</span
              >
              <div
                id="score-mathB"
                class="w-16 p-2 text-center text-indigo-700 font-bold"
              ></div>
            </div>
            <div
              class="flex items-center bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden"
            >
              <span
                class="bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 border-r border-slate-200"
                >社會</span
              >
              <div
                id="score-society"
                class="w-16 p-2 text-center text-indigo-700 font-bold"
              ></div>
            </div>
            <div
              class="flex items-center bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden"
            >
              <span
                class="bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 border-r border-slate-200"
                >自然</span
              >
              <div
                id="score-science"
                class="w-16 p-2 text-center text-indigo-700 font-bold"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="bg-white shadow-xl rounded-xl overflow-hidden border-2 border-indigo-200 relative"
      >
        <div
          class="w-full overflow-x-auto cursor-grab active:cursor-grabbing hide-scrollbar"
          id="table-scroll-container"
        >
          <table id="main-table" class="custom-table">
            <thead>
              <tr>
                <th rowspan="2" colspan="2" class="tracking-wider">
                  大學校系<br />
                </th>
                <th
                  rowspan="2"
                  class="col-prediction border-thick-r tracking-wider leading-snug"
                >
                  一階篩選<br />強度預測
                </th>
                <th rowspan="2" class="col-subject-label border-thick-r">
                  科目
                </th>
                <th rowspan="2" class="col-score text-slate-700">國</th>
                <th rowspan="2" class="col-score text-slate-700">英</th>
                <th rowspan="2" class="col-score text-slate-700">數A</th>
                <th rowspan="2" class="col-score text-slate-700">數B</th>
                <th rowspan="2" class="col-score text-slate-700">社</th>
                <th rowspan="2" class="col-score border-thick-r text-slate-700">
                  自
                </th>
                <th rowspan="2" class="col-combo">考科組合</th>
                <th rowspan="2" class="col-quota border-thick-r">
                  招生<br />名額
                </th>
                <th rowspan="2" class="col-date border-thick-r">
                  上傳<br />日期
                </th>
                <th rowspan="2" class="col-date border-thick-r">
                  面試<br />日期
                </th>
                <th colspan="4" class="tracking-wider">第二階段及出路</th>
              </tr>
              <tr>
                <th class="col-phase2 font-medium">學測成績比重</th>
                <th class="col-phase2 font-medium">指定項目</th>
                <th class="col-note font-medium">額外說明</th>
                <th class="col-career font-medium">出路(AI)</th>
              </tr>
            </thead>
          </table>
        </div>
      </div>
    </div>

    <script>
      const subjects = [
        "chinese",
        "english",
        "mathA",
        "mathB",
        "society",
        "science",
      ];
      const mainTable = document.getElementById("main-table");

      function createRowHTML(id, rowData) {
        rowData = rowData || {};
        const tag = rowData.tag || "";
        let tagName = "無";
        let tagClass = "text-slate-400";
        let blockClass = "hover:bg-slate-50/70";
        let tagBg = "bg-transparent";

        if (tag === "medical") {
          tagName = "醫藥衛生";
          tagClass = "text-amber-600";
          blockClass = "bg-amber-50/80";
          tagBg = "bg-amber-100";
        } else if (tag === "engineering") {
          tagName = "工程";
          tagClass = "text-emerald-600";
          blockClass = "bg-emerald-50/80";
          tagBg = "bg-emerald-100";
        } else if (tag === "public") {
          tagName = "公費生";
          tagClass = "text-rose-600";
          blockClass = "bg-rose-50/80";
          tagBg = "bg-rose-100";
        } else if (tag === "bio") {
          tagName = "生物資源";
          tagClass = "text-violet-600";
          blockClass = "bg-violet-50/80";
          tagBg = "bg-violet-100";
        }

        const pred = rowData.prediction || "";
        let predClass = "text-slate-400";
        if (pred === "✕") predClass = "text-red-500 font-sans tracking-normal";
        else if (pred) predClass = "text-amber-500 tracking-tighter";

        const isChecked = rowData.passCheckbox ? "checked" : "";

        // 將換行符號轉成 <br>
        const formatText = (text) => (text || "").replace(/\n/g, "<br/>");

        return `
            <tbody class="item-block ${blockClass} transition-colors">
                <tr>
                    <td rowspan="3" class="col-id bg-slate-50/50 relative">
                        <span class="row-number">${id}</span>
                        <div class="mt-2 text-center text-[10px] font-bold border border-slate-200 rounded py-0.5 ${tagBg} ${tagClass}">
                            ${tagName}
                        </div>
                    </td>
                    <td rowspan="3" class="col-dept bg-slate-50/50 text-lg">${formatText(rowData.dept)}</td>
                    <td rowspan="3" class="col-prediction bg-slate-50/50 border-thick-r align-middle font-bold text-sm ${predClass}">${pred}</td>
                    <td class="col-subject-label border-thick-r">115 篩選倍率</td>
                    ${subjects.map((s, i) => `<td class="${s === "science" ? "border-thick-r" : ""}">${(rowData.s115 && rowData.s115[i]) || ""}</td>`).join("")}
                    <td class="col-combo">${formatText(rowData.combo)}</td>
                    <td class="col-quota border-thick-r text-center font-medium">${formatText(rowData.quota)}</td>
                    <td rowspan="4" class="border-thick-r text-center text-sm">${formatText(rowData.uploadDate)}</td>
                    <td rowspan="4" class="border-thick-r text-center text-sm">${formatText(rowData.interviewDate)}</td>
                    <td rowspan="4" class="text-center text-sm">${formatText(rowData.weight)}</td>
                    <td rowspan="4" class="text-center text-sm">${formatText(rowData.requirements)}</td>
                    <td rowspan="4" class="text-left text-sm text-slate-600 align-top">${formatText(rowData.note)}</td>
                    <td rowspan="4" class="text-left text-sm text-slate-600 align-top">${formatText(rowData.career)}</td>
                </tr>
                <tr>
                    <td class="col-subject-label border-thick-r">114 篩選倍率</td>
                    ${subjects.map((s, i) => `<td class="${s === "science" ? "border-thick-r" : ""}">${(rowData.s114 && rowData.s114[i]) || ""}</td>`).join("")}
                    <td>${formatText(rowData.combo114)}</td>
                    <td class="border-thick-r">${formatText(rowData.quota114)}</td>
                </tr>
                <tr>
                    <td class="col-subject-label border-thick-r">114 年通過級分</td>
                    ${subjects.map((s, i) => `<td data-type="passing" data-subject="${s}" class="bg-indigo-50/40 font-medium ${s === "science" ? "border-thick-r" : ""}">${(rowData.p114 && rowData.p114[i]) || ""}</td>`).join("")}
                    <td>${formatText(rowData.comboP114)}</td>
                    <td class="border-thick-r">${formatText(rowData.quotaP114)}</td>
                </tr>
                <tr>
                    <td colspan="3" class="${rowData.passCheckbox ? "bg-emerald-100 border-thick-r p-0" : "bg-slate-100/60 border-thick-r p-0"} transition-colors">
                        <div class="flex items-center justify-center w-full h-full gap-2 py-2.5">
                            <input type="checkbox" disabled class="w-4 h-4 text-emerald-600 rounded border-slate-400 shadow-sm" ${isChecked} />
                            <span class="text-sm font-bold ${rowData.passCheckbox ? "text-emerald-800" : "text-slate-700"}">過檢定</span>
                        </div>
                    </td>
                    <td class="col-subject-label bg-slate-100/60 border-thick-r font-bold leading-tight">正負分<br/><span class="text-xs font-normal text-slate-500">(與114 年通過級分比較)</span></td>
                    ${subjects.map((sub) => `<td data-type="diff" data-subject="${sub}" class="text-center font-bold text-lg bg-slate-50/80 ${sub === "science" ? "border-thick-r" : ""}"></td>`).join("")}
                    <td class="bg-slate-50/80 last-row-1-cell" data-raw="${encodeURIComponent(rowData.lastRow1 || "")}">${formatText(rowData.lastRow1)}</td>
                    <td class="bg-slate-50/80 border-thick-r">${formatText(rowData.lastRow2)}</td>
                </tr>
            </tbody>
        `;
      }

      function restoreTableData(data) {
        if (data.scores) {
          subjects.forEach((sub, i) => {
            const el = document.getElementById(`score-${sub}`);
            if (el)
              el.innerText =
                data.scores[i] !== undefined && data.scores[i] !== null
                  ? data.scores[i]
                  : "";
          });
        }

        mainTable
          .querySelectorAll("tbody.item-block")
          .forEach((b) => b.remove());
        if (data.rows) {
          data.rows.forEach((rowData, idx) => {
            mainTable.insertAdjacentHTML(
              "beforeend",
              createRowHTML(idx + 1, rowData),
            );
          });
        }
        calculateDifferences();
      }

      function calculateDifferences() {
        const userScores = {};
        subjects.forEach((sub) => {
          const val = document.getElementById(`score-${sub}`).innerText.trim();
          userScores[sub] = val !== "" ? parseInt(val, 10) : null;
        });

        const blocks = mainTable.querySelectorAll("tbody.item-block");
        blocks.forEach((block) => {
          subjects.forEach((sub) => {
            const passCell = block.querySelector(
              `td[data-type="passing"][data-subject="${sub}"]`,
            );
            const diffCell = block.querySelector(
              `td[data-type="diff"][data-subject="${sub}"]`,
            );

            if (passCell && diffCell) {
              const passText = passCell.innerText.trim();
              const passScore = parseInt(passText, 10);

              if (
                !isNaN(passScore) &&
                userScores[sub] !== null &&
                !isNaN(userScores[sub])
              ) {
                const diff = userScores[sub] - passScore;
                diffCell.innerText = diff > 0 ? `+${diff}` : diff;
                if (diff >= 0) {
                  diffCell.className =
                    diffCell.className
                      .replace(/text-red-500/g, "")
                      .replace(/text-emerald-500/g, "") + " text-emerald-500";
                } else {
                  diffCell.className =
                    diffCell.className
                      .replace(/text-emerald-500/g, "")
                      .replace(/text-red-500/g, "") + " text-red-500";
                }
              } else {
                diffCell.innerText = "";
              }
            }
          });

          // 處理 lastRow1 的顏色
          const lastRow1Cell = block.querySelector(".last-row-1-cell");
          if (lastRow1Cell) {
            const rawVal = decodeURIComponent(
              lastRow1Cell.getAttribute("data-raw") || "",
            );
            const lines = rawVal.split("\n");
            const processedLines = lines.map((line) => {
              line = line.trim();
              if (!line || line === "×" || line === "X" || line === "x")
                return line;

              let checkVal = line;
              if (checkVal.startsWith("+")) checkVal = checkVal.substring(1);
              const num = parseFloat(checkVal);

              if (!isNaN(num)) {
                if (num >= 0) {
                  return `<span class="text-emerald-500">${line}</span>`;
                } else {
                  return `<span class="text-red-500">${line}</span>`;
                }
              }
              return line;
            });
            lastRow1Cell.innerHTML = processedLines.join("<br/>");
          }
        });
      }

      function applySearchFilter() {
        const query = document
          .getElementById("search-input")
          .value.trim()
          .toLowerCase();
        const blocks = mainTable.querySelectorAll("tbody.item-block");
        blocks.forEach((block) => {
          const deptCell = block.querySelector(".col-dept");
          if (deptCell) {
            const text = deptCell.innerText.toLowerCase();
            const matches = text.includes(query);
            block.style.display = matches ? "" : "none";
          }
        });
      }

      function initDragScroll() {
        const slider = document.getElementById("table-scroll-container");
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener("mousedown", (e) => {
          isDown = true;
          slider.classList.add("active");
          startX = e.pageX - slider.offsetLeft;
          scrollLeft = slider.scrollLeft;
        });

        slider.addEventListener("mouseleave", () => {
          isDown = false;
          slider.classList.remove("active");
        });

        slider.addEventListener("mouseup", () => {
          isDown = false;
          slider.classList.remove("active");
        });

        slider.addEventListener("mousemove", (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - slider.offsetLeft;
          const walk = (x - startX) * 1.5; // 滑動速度加成
          slider.scrollLeft = scrollLeft - walk;
        });
      }

      window.addEventListener("DOMContentLoaded", () => {
        initDragScroll();

        // 使用 fetch 讀取本地 data.json 檔案
        fetch("data.json")
          .then((res) => {
            if (!res.ok) throw new Error("HTTP error " + res.status);
            return res.json();
          })
          .then((data) => {
            restoreTableData(data);
          })
          .catch((err) => {
            console.error("無法讀取 data.json:", err);
            const tableContainer = document.querySelector(".overflow-x-auto");
            tableContainer.insertAdjacentHTML(
              "beforebegin",
              '<div class="bg-red-50 text-red-600 p-4 rounded-xl mb-4 shadow-sm border border-red-200"><h3 class="font-bold mb-1">⚠️ 無法讀取 data.json</h3><p class="text-sm">如果直接雙擊開啟此 HTML 檔案，瀏覽器可能會因為 CORS 安全政策阻擋讀取本地檔案。<br>請嘗試將其放在本地伺服器中執行 (例如: VSCode 中的 Live Server 擴充功能，或使用 Python 的 <code>python -m http.server</code>)。</p></div>',
            );
          });
      });
    </script>
  </body>
</html>
