<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FUCK @ LINK</title>
    <!-- PWA Manifest 與桌面圖示設定 -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#F7F4EE">
    <!-- 引入 Noto Serif TC 與 Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F7F4EE;
            background-image: radial-gradient(circle at 50% 50%, #FAF8F5 0%, #F1ECE1 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Serif TC', serif;
            color: #4A453B;
        }

        /* 毛玻璃主要卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
            padding: 28px 24px;
            box-shadow: 0 16px 32px -8px rgba(180, 170, 150, 0.18);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 手動貼上按鈕 */
        .paste-btn {
            background: #7A7060;
            color: #F7F4EE;
            border: none;
            border-radius: 18px;
            padding: 14px;
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(122, 112, 96, 0.2);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .paste-btn:active {
            transform: scale(0.96);
            background: #655C4F;
        }

        /* Terminal 終端機控制台 */
        .terminal {
            background: #2B2823;
            color: #DCD3C5;
            border-radius: 18px;
            padding: 16px;
            font-family: monospace;
            font-size: 0.82rem;
            line-height: 1.6;
            min-height: 130px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
            word-break: break-all;
        }

        .terminal-line {
            margin: 0 0 6px 0;
            display: flex;
            gap: 8px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        .terminal-line .prompt {
            color: #8C8273;
            flex-shrink: 0;
        }

        .terminal-line .success {
            color: #62C584;
        }

        .terminal-line .error {
            color: #E86C6C;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* LINE 與 Telegram 按鈕區塊 */
        .action-group {
            display: flex;
            justify-content: space-around;
            gap: 16px;
            padding-top: 4px;
        }

        .icon-btn {
            text-decoration: none;
            width: 68px;
            height: 68px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-line {
            background: rgba(6, 199, 85, 0.1);
            color: #06C755;
            border: 1px solid rgba(6, 199, 85, 0.2);
        }

        .btn-tg {
            background: rgba(42, 171, 238, 0.1);
            color: #2AABEE;
            border: 1px solid rgba(42, 171, 238, 0.2);
        }

        .icon-btn:active {
            transform: scale(0.88);
        }

        .btn-line:active {
            background: rgba(6, 199, 85, 0.25);
        }

        .btn-tg:active {
            background: rgba(42, 171, 238, 0.25);
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <button id="paste-btn" class="paste-btn">
            <i class="fa-solid fa-paste"></i>
        </button>

        <div class="terminal" id="terminal">
            <div class="terminal-line"><span class="prompt">$</span> 等待讀取連結...</div>
        </div>

        <div class="action-group">
            <a id="line-btn" href="#" class="icon-btn btn-line" aria-label="LINE">
                <i class="fa-brands fa-line"></i>
            </a>
            <a id="tg-btn" href="#" class="icon-btn btn-tg" aria-label="Telegram">
                <i class="fa-brands fa-telegram"></i>
            </a>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');

        function printLog(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = 'terminal-line';

            let colorClass = '';
            if (type === 'success') colorClass = 'class="success"';
            if (type === 'error') colorClass = 'class="error"';

            line.innerHTML = `<span class="prompt">$</span> <span ${colorClass}>${msg}</span>`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // 解析並還原短網址的核心函式
        async function expandShortUrl(shortUrl) {
            printLog('正在解析...');
            try {
                // 帶入 Worker 網址
                const workerUrl = `https://threads-unshorten.b25553336.workers.dev/?url=${encodeURIComponent(shortUrl)}`;
                const response = await fetch(workerUrl);
                const data = await response.json();

                if (data && data.finalUrl) {
                    return data.finalUrl;
                }
            } catch (e) {
                printLog('解析短網址失敗，嘗試直接清理...', 'error');
            }
            return shortUrl;
        }
        async function processUrl(sharedUrl) {
            if (!sharedUrl) {
                printLog('未偵測到有效網址！', 'error');
                return;
            }

            printLog(`已讀取原始連結: ${sharedUrl}`);

            let targetUrl = sharedUrl;

            // 1. 如果是短網址，進行還原
            if (sharedUrl.includes('/share/')) {
                targetUrl = await expandShortUrl(sharedUrl);
                printLog(`還原後完整網址: ${targetUrl}`);
            }

            // 2. 切除問號及後方的所有追蹤碼
            let cleanUrl = targetUrl;
            try {
                const urlObj = new URL(targetUrl);
                cleanUrl = `${urlObj.origin}${urlObj.pathname}`;
            } catch (err) {
                const queryIndex = cleanUrl.indexOf('?');
                if (queryIndex !== -1) {
                    cleanUrl = cleanUrl.substring(0, queryIndex);
                }
            }

            printLog(`處理後網址: ${cleanUrl}`, 'success');

            // 3. 寫回剪貼簿
            try {
                await navigator.clipboard.writeText(cleanUrl);
                printLog('已自動複製', 'success');
            } catch (e) {
                printLog('複製失敗，請檢查權限', 'error');
            }

            // 4. 設定跳轉按鈕
            const encodedUrl = encodeURIComponent(cleanUrl);
            document.getElementById('line-btn').href = `https://line.me/R/msg/text/?${encodedUrl}`;
            document.getElementById('tg-btn').href = `tg://msg_url?url=${encodedUrl}`;

            printLog('處理完畢，請點擊下方圖標！', 'success');
        }

        // 手動貼上按鈕點擊
        document.getElementById('paste-btn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                processUrl(text);
            } catch (err) {
                printLog('未能取得剪貼簿讀取權限', 'error');
            }
        });

        // 自動接收 Share Target 參數
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const sharedUrl = params.get('url') || params.get('text') || '';
            if (sharedUrl) {
                processUrl(sharedUrl);
            }
        });
    </script>
</body>

</html>
